# Local override for this Apple silicon Mac.
#
# The published ghcr.io image is linux/amd64 only, which would run emulated here.
# Instead the sandbox builds on a locally built linux/arm64 image
# (`docker build --target server -t openmausbot-native:latest .`), so no platform
# pin is needed. Two loopback addresses are published because `localhost` resolves
# to ::1 first on macOS and an IPv4-only publish refuses those connections.
#
# Connected apps reach the sandbox through the managed service: the packaged
# desktop app registers one installation per install and hands the token to its
# own child server, which a separate container never receives, so the sandbox
# carries its own installation from the same service in .env instead. Connections
# live under that installation's Composio user, so reconnecting Gmail and the rest
# happens in the app while the sandbox is the active server. A COMPOSIO_API_KEY
# (project key) takes priority over the broker whenever one is set.
services:
  objectives:
    extends:
      file: compose.objectives.yaml
      service: objectives
  legal-queue:
    extends:
      file: compose.legal-queue.yaml
      service: legal-queue
  attention-scan:
    extends:
      file: compose.attention.yaml
      service: attention-scan
  caddy:
    ports: !override
      - "127.0.0.1:8090:80"
      - "[::1]:8090:80"
  omb:
    security_opt:
      - seccomp=./deploy/local/seccomp/codex-nested.json
    volumes:
      - ./deploy/local/work-review-mcp.cjs:/usr/local/bin/work-review-mcp:ro
      - ./deploy/local/newsletter-template-preflight:/usr/local/bin/newsletter-template-preflight:ro
      - ./deploy/local/newsletter-template-prepare:/usr/local/bin/newsletter-template-prepare:ro
    environment:
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      OMB_COMPOSIO_BROKER_URL: ${OMB_COMPOSIO_BROKER_URL:-}
      OMB_COMPOSIO_BROKER_TOKEN: ${OMB_COMPOSIO_BROKER_TOKEN:-}
volumes:
  objective-state:
  legal-queue-state:
